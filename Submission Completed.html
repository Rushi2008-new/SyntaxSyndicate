<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Completed | Syntax Syndicate</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --container-bg: #161b22;
            --primary-green: #4ade80;
            --text-main: #c9d1d9;
            --muted-text: #8b949e;
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            display: grid;
            place-items: center;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .completion-card {
            width: min(100%, 620px);
            padding: 3.5rem 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--container-bg);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .success-mark {
            width: 76px;
            height: 76px;
            margin: 0 auto 1.5rem;
            display: grid;
            place-items: center;
            border: 2px solid var(--primary-green);
            border-radius: 50%;
            color: var(--primary-green);
            font-size: 2.5rem;
            font-weight: 700;
        }

        h1 {
            margin: 0 0 1rem;
            color: var(--primary-green);
            font-size: clamp(2rem, 7vw, 3rem);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        p {
            margin: 0 auto;
            max-width: 30rem;
            line-height: 1.6;
        }

        .details {
            margin-top: 2rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--border-color);
            color: var(--muted-text);
            font-size: 0.95rem;
        }

        .tagline {
            margin-top: 1.5rem;
            color: var(--primary-green);
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        @media (max-width: 520px) {
            body {
                padding: 1rem;
            }

            .completion-card {
                padding: 2.5rem 1.5rem;
            }
        }
    </style>
</head>

<body>
    <main class="completion-card" role="status" aria-live="polite">
        <div class="success-mark" aria-hidden="true">&#10003;</div>
        <h1>Submission Completed</h1>
        <p>Your answers have been submitted successfully. Thank you for completing the Syntax Syndicate challenge.</p>
        <p class="details">Your response has been sent for evaluation. You may now close this page.</p>
        <p class="tagline">DEBUG. JUSTIFY. CONQUER.</p>
    </main>
</body>

</html>
